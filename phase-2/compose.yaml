
services:
  router:
    image: officepc
    container_name: router
    hostname: router
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      staff:
        ipv4_address: 192.168.10.254
      servers:
        ipv4_address: 192.168.20.254

  pc1:
    image: officepc
    container_name: pc1
    hostname: pc1
    cap_add:
      - NET_ADMIN
    command:
      - sh
      - -c
      - ip route replace default via 192.168.10.254 && exec sleep infinity
    depends_on:
      - router
    networks:
      staff:
        ipv4_address: 192.168.10.11

  server:
    image: officepc
    container_name: server
    hostname: server
    cap_add:
      - NET_ADMIN
    command:
      - sh
      - -c
      - ip route replace default via 192.168.20.254 && exec sleep infinity
    depends_on:
      - router
    networks:
      servers:
        ipv4_address: 192.168.20.10

networks:
  staff:
    name: staff
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 192.168.10.0/24

  servers:
    name: servers
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 192.168.20.0/24
